function cloneModel(key){
  if(!modelCache[key]) return null;
  if(typeof THREE.SkeletonUtils !== 'undefined' && THREE.SkeletonUtils.clone){
    return THREE.SkeletonUtils.clone(modelCache[key]);
  }
  return modelCache[key].clone(true);
}

function preloadGLB(key, url, targetHeight){
  return new Promise(function(resolve){
    let done=false;
    const timeout = setTimeout(function(){
      if(done) return; done=true; resolve();
    }, 20000);
    try{
      gltfLoader.load(url, function(gltf){
        if(done) return; done=true; clearTimeout(timeout);
        const mdl=gltf.scene;
        const bbox=new THREE.Box3().setFromObject(mdl);
        const size=new THREE.Vector3();
        bbox.getSize(size);
        const s=targetHeight/(size.y||1);
        mdl.scale.setScalar(s);
        const bbox2=new THREE.Box3().setFromObject(mdl);
        const center=new THREE.Vector3();
        bbox2.getCenter(center);
        mdl.position.set(-center.x,-bbox2.min.y,-center.z);
        mdl.traverse(function(o){
          if(o.isMesh){
            o.castShadow=true;
            o.receiveShadow=true;
            o.frustumCulled=false;
            if(o.material){ o.material.side=THREE.DoubleSide; }
          }
        });
        modelCache[key]=mdl;
        resolve();
      }, undefined, function(){ if(done) return; done=true; clearTimeout(timeout); resolve(); });
    }catch(e){ if(done) return; done=true; clearTimeout(timeout); resolve(); }
  });
}

function makeTex(size,fn){
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  fn(cv.getContext('2d'),size);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.encoding=THREE.sRGBEncoding;
  t.anisotropy=4;
  return t;
}
function speckle(ctx,S,n,alpha){for(let i=0;i<n;i++){ctx.fillStyle='rgba('+(Math.random()<0.5?'0,0,0':'255,255,255')+','+(Math.random()*alpha)+')';ctx.fillRect(Math.random()*S,Math.random()*S,1.4,1.4);}}
function blobStain(ctx,S,x,y,r,col){ctx.save();ctx.globalAlpha=0.16+Math.random()*0.2;ctx.fillStyle=col;ctx.beginPath();const pts=9;for(let i=0;i<=pts;i++){const a=i/pts*Math.PI*2;const rr=r*(0.55+Math.random()*0.7);const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();ctx.fill();ctx.restore();}
function tileTex(S,base,tilesX,tilesY,grout){
  return makeTex(S,function(ctx,S2){
    ctx.fillStyle=base;ctx.fillRect(0,0,S2,S2);
    const tw=S2/tilesX,th=S2/tilesY;
    for(let ry=0;ry<tilesY;ry++)for(let rx=0;rx<tilesX;rx++){
      const v=Math.random()*14-7;
      ctx.fillStyle='rgb('+(110+v)+','+(116+v)+','+(98+v)+')';
      ctx.fillRect(rx*tw+2,ry*th+2,tw-4,th-4);
    }
    ctx.strokeStyle=grout;ctx.lineWidth=4;
    for(let ry=0;ry<=tilesY;ry++){ctx.beginPath();ctx.moveTo(0,ry*th);ctx.lineTo(S2,ry*th);ctx.stroke();}
    for(let rx=0;rx<=tilesX;rx++){ctx.beginPath();ctx.moveTo(rx*tw,0);ctx.lineTo(rx*tw,S2);ctx.stroke();}
    for(let i=0;i<26;i++)blobStain(ctx,S2,Math.random()*S2,Math.random()*S2,10+Math.random()*46,'#20241c');
    speckle(ctx,S2,3000,0.06);
  });
}

const ROOM_DEFS=[
 {c0:1,c1:4,r0:1,r1:5,dr:6,dc:2},
 {c0:5,c1:8,r0:1,r1:5,dr:6,dc:6},
 {c0:12,c1:15,r0:1,r1:5,dr:6,dc:13},
 {c0:16,c1:17,r0:1,r1:5,dr:6,dc:16},
 {c0:1,c1:4,r0:9,r1:13,dr:8,dc:2},
 {c0:5,c1:8,r0:9,r1:13,dr:8,dc:6},
 {c0:12,c1:15,r0:9,r1:13,dr:8,dc:13},
 {c0:16,c1:19,r0:9,r1:13,dr:8,dc:17}
];
const SHAFT_C=19, SHAFT_R=7;
function genFloorMap(fi){
  const g=[];
  for(let r=0;r<MAP_H;r++){g[r]=[];for(let c=0;c<MAP_W;c++)g[r][c]='#';}
  for(let c=1;c<=19;c++)g[7][c]='.';
  for(let r=1;r<=13;r++)g[r][10]='.';
  const rng=mulberry32(fi*7919+13);
  const rooms=[];
  for(let i=0;i<ROOM_DEFS.length;i++){
    const d=ROOM_DEFS[i];
    for(let r=d.r0;r<=d.r1;r++)for(let c=d.c0;c<=d.c1;c++)g[r][c]='.';
    g[d.dr][d.dc]='D';
    const zm=d.r0+2;
    const partition=rng()<0.55;
    let gapC=d.c0;
    const subs=[];
    if(partition){
      gapC=d.c0+Math.floor(rng()*(d.c1-d.c0+1));
      for(let c=d.c0;c<=d.c1;c++){if(c!==gapC)g[zm][c]='#';}
      g[zm][gapC]='D';
      subs.push({c0:d.c0,c1:d.c1,r0:d.r0,r1:zm-1});
      subs.push({c0:d.c0,c1:d.c1,r0:zm+1,r1:d.r1});
    }else{
      subs.push({c0:d.c0,c1:d.c1,r0:d.r0,r1:d.r1});
    }
    rooms.push({def:d,partition:partition,gapC:gapC,zm:zm,subs:subs,idx:i});
  }
  g[SHAFT_R][SHAFT_C]='E';
  return {grid:g,rooms:rooms};
}
const floorData=[];
for(let f=0;f<FLOORS;f++)floorData.push(genFloorMap(f));

const FURN={
  ward:function(rng){const x=rng();return x<0.6?makeBed(rng):(x<0.8?makeIV(rng):makeLocker(rng));},
  office:function(rng){const x=rng();return x<0.35?makeTable(rng):(x<0.6?makeChair(rng):(x<0.8?makeLocker(rng):makeMonitor(rng)));},
  storage:function(rng){return rng()<0.65?makeCrate(rng):makeDebris(rng);},
  or:function(rng){const x=rng();return x<0.35?makeSteelTable(rng):(x<0.55?makeGurney(rng):(x<0.7?makeSink(rng):(x<0.85?makeIV(rng):makeMonitor(rng))));},
  morgue:function(rng){const x=rng();return x<0.5?makeSteelTable(rng):(x<0.8?makeCrate(rng):makeDebris(rng));}
};
const FLOOR_THEMES=[
 ['office','storage','ward','office','ward','storage','ward','office'],
 ['ward','ward','ward','office','ward','ward','storage','ward'],
 ['or','office','or','storage','or','office','ward','or'],
 ['morgue','storage','morgue','storage','morgue','storage','morgue','storage']
];

// ================= WORLD BUILD =================
const floorGroups=[];
const colliders=[];
const fixtures=[];
const grids=[];
const items=[];
const hideLockers=[];
const lockedDoors=[];
const wallsMeshes=[],floorMeshes=[],ceilMeshes=[];
const wallGeo=new THREE.BoxGeometry(CELL,WALL_H,CELL);

function addFixture(f,x,z,rng,group){
  const t=rng();
  let type;
  if(t<0.16)type=0;else if(t<0.72)type=1;else type=2;
  const panelMat=(type===2)?matPanelOn.clone():((type===1)?matPanelOn:matPanelOff);
  const y=f*FLOOR_H+WALL_H-0.06;
  group.add(box(1.3,0.1,0.42,matDarkMetal,x,y+0.02,z));
  group.add(box(1.15,0.05,0.3,panelMat,x,y-0.04,z));
  fixtures[f].push({x:x,y:y-0.15,z:z,type:type,phase:rng()*100,mat:panelMat,base:1.05+rng()*0.3});
}
function addDoorFrame(f,r,c,rng,group){
  const x=wx(c),z=wz(r),y0=f*FLOOR_H;
  group.add(box(0.22,2.2,0.3,matWoodDoor,x-CELL/2+0.11,y0+1.1,z));
  group.add(box(0.22,2.2,0.3,matWoodDoor,x+CELL/2-0.11,y0+1.1,z));
  group.add(box(CELL,0.15,0.3,matWoodDoor,x,y0+2.27,z));
  group.add(box(CELL,WALL_H-2.35,CELL,matWall,x,y0+2.35+(WALL_H-2.35)/2,z));
  if(rng()<0.55){
    const dp=box(0.92,2.05,0.05,matWoodDoor,x-0.7,y0+1.05,z+(rng()-0.5)*0.8);
    dp.rotation.y=0.9+rng()*0.5;
    dp.castShadow=true;group.add(dp);
  }
}
function makeLockedPanel(f,r,c){
  const x=wx(c),z=wz(r),y0=f*FLOOR_H;
  const p=box(2.25,2.15,0.1,matWoodDoor,x,y0+1.08,z);
  p.castShadow=true;
  floorGroups[f].add(p);
  const kn=box(0.06,0.16,0.06,matSteel,x+0.85,y0+1.05,z+0.09);
  floorGroups[f].add(kn);
  const aabb={minX:x-CELL/2+0.2,maxX:x+CELL/2-0.2,minZ:z-0.2,maxZ:z+0.2};
  colliders[f].push(aabb);
  return {panel:p,aabb:aabb,unlocked:false,r:r,c:c,f:f};
}

const WALL_OFF = 0.018;

function placeXrayPanel(g, f, sub, rng){
  const sides=[];
  const midC=Math.floor((sub.c0+sub.c1)/2);
  const midR=Math.floor((sub.r0+sub.r1)/2);
  if(sub.r0-1>=0 && g[sub.r0-1][midC]==='#') sides.push({axis:'z',dir:-1});
  if(sub.r1+1<MAP_H && g[sub.r1+1][midC]==='#') sides.push({axis:'z',dir:1});
  if(sub.c0-1>=0 && g[midR][sub.c0-1]==='#') sides.push({axis:'x',dir:-1});
  if(sub.c1+1<MAP_W && g[midR][sub.c1+1]==='#') sides.push({axis:'x',dir:1});
  if(!sides.length) return;
  const s=sides[Math.floor(rng()*sides.length)];
  let x,y,z,ry;
  const spanC=(sub.c1-sub.c0)*CELL;
  const spanR=(sub.r1-sub.r0)*CELL;
  const yPl=1.65;
  if(s.axis==='z'){
    x=wx(midC)+(rng()-0.5)*Math.max(0,spanC-1.2);
    z=(s.dir===-1)?(wz(sub.r0)-CELL/2+WALL_OFF):(wz(sub.r1)+CELL/2-WALL_OFF);
    y=f*FLOOR_H+yPl;
    ry=(s.dir===-1)?0:Math.PI;
  }else{
    x=(s.dir===-1)?(wx(sub.c0)-CELL/2+WALL_OFF):(wx(sub.c1)+CELL/2-WALL_OFF);
    z=wz(midR)+(rng()-0.5)*Math.max(0,spanR-1.2);
    y=f*FLOOR_H+yPl;
    ry=(s.dir===-1)?Math.PI/2:-Math.PI/2;
  }
  const tex=xrayMats[Math.floor(rng()*2)];
  const lm=new THREE.Mesh(new THREE.PlaneGeometry(0.95,1.2),tex);
  lm.position.set(x,y,z);
  lm.rotation.y=ry;
  lm.renderOrder=1;
  floorGroups[f].add(lm);
}

function buildFloor(f){
  const rng=mulberry32(f*31337+7);
  const group=new THREE.Group();
  floorGroups[f]=group;
  const fd=floorData[f];
  const g=fd.grid;
  grids[f]=g;
  colliders[f]=[];
  fixtures[f]=[];
  items[f]=[];
  hideLockers[f]=[];
  lockedDoors[f]=[];
  let count=0;
  for(let r=0;r<MAP_H;r++)for(let c=0;c<MAP_W;c++)if(g[r][c]==='#')count++;
  const walls=new THREE.InstancedMesh(wallGeo,matWall,count);
  walls.receiveShadow=true;
  const mtx=new THREE.Matrix4();
  let idx=0;
  for(let r=0;r<MAP_H;r++)for(let c=0;c<MAP_W;c++){
    if(g[r][c]==='#'){
      mtx.makeTranslation(wx(c),f*FLOOR_H+WALL_H/2,wz(r));
      walls.setMatrixAt(idx++,mtx);
    }
  }
  walls.instanceMatrix.needsUpdate=true;
  group.add(walls);
  wallsMeshes[f]=walls;
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(MAP_W*CELL,MAP_H*CELL),matFloor);
  fl.rotation.x=-Math.PI/2;fl.position.y=f*FLOOR_H+0.01;fl.receiveShadow=true;group.add(fl);
  floorMeshes[f]=fl;
  const cl=new THREE.Mesh(new THREE.PlaneGeometry(MAP_W*CELL,MAP_H*CELL),matCeil);
  cl.rotation.x=Math.PI/2;cl.position.y=f*FLOOR_H+WALL_H;group.add(cl);
  ceilMeshes[f]=cl;
  for(let r=0;r<MAP_H;r++)for(let c=0;c<MAP_W;c++){
    if(g[r][c]==='D')addDoorFrame(f,r,c,rng,group);
  }
  for(let c=2;c<=18;c+=4){if(g[7][c]==='.')addFixture(f,wx(c),wz(7),rng,group);}
  for(let r=2;r<=12;r+=4){if(r!==7&&g[r][10]==='.')addFixture(f,wx(10),wz(r),rng,group);}
  const occupied={};
  const key=function(r,c){return r*100+c;};
  if(f===3)occupied[key(12,17)]=1;
  const allFreeCells=[];
  for(let i=0;i<fd.rooms.length;i++){
    const room=fd.rooms[i];
    const clear={};
    clear[key(room.def.dr,room.def.dc)]=1;
    const inward=(room.def.dr===6)?room.def.dr-1:room.def.dr+1;
    clear[key(inward,room.def.dc)]=1;
    if(room.partition){
      clear[key(room.zm,room.gapC)]=1;
      clear[key(room.zm-1,room.gapC)]=1;
      clear[key(room.zm+1,room.gapC)]=1;
    }
    const theme=FLOOR_THEMES[f][i];
    for(let s=0;s<room.subs.length;s++){
      const sub=room.subs[s];
      addFixture(f,wx((sub.c0+sub.c1)/2),wz((sub.r0+sub.r1)/2),rng,group);
      const cells=[];
      for(let r=sub.r0;r<=sub.r1;r++)for(let c=sub.c0;c<=sub.c1;c++){
        if(g[r][c]!=='.'||clear[key(r,c)]||occupied[key(r,c)])continue;
        cells.push([r,c]);
      }
      shuffleArr(cells,rng);
      const budget=(theme==='storage')?(3+Math.floor(rng()*3)):(2+Math.floor(rng()*2));
      let placed=0;
      for(let k=0;k<cells.length&&placed<budget;k++){
        const r=cells[k][0],c=cells[k][1];
        const item=FURN[theme](rng);
        const m=item.group;
        const rot90=rng()<0.5;
        m.rotation.y=rot90?Math.PI/2:0;
        m.position.set(wx(c),f*FLOOR_H,wz(r));
        group.add(m);
        occupied[key(r,c)]=1;
        if(!item.soft){
          const hw=(rot90?item.d:item.w)/2, hd=(rot90?item.w:item.d)/2;
          colliders[f].push({minX:wx(c)-hw,maxX:wx(c)+hw,minZ:wz(r)-hd,maxZ:wz(r)+hd});
        }
        placed++;
      }
      for(let r=sub.r0;r<=sub.r1;r++)for(let c=sub.c0;c<=sub.c1;c++){
        if(!occupied[key(r,c)]&&g[r][c]==='.'&&!clear[key(r,c)])allFreeCells.push([r,c]);
      }
      if(theme==='or'&&cells.length>2&&rng()<0.8){
        const xr=makeXray(rng);
        const cc2=sub.c0+Math.floor((sub.c1-sub.c0)/2),rr2=sub.r0;
        if(!occupied[key(rr2,cc2)]){
          xr.group.position.set(wx(cc2),f*FLOOR_H,wz(rr2));
          group.add(xr.group);
          occupied[key(rr2,cc2)]=1;
          colliders[f].push({minX:wx(cc2)-0.55,maxX:wx(cc2)+0.55,minZ:wz(rr2)-0.55,maxZ:wz(rr2)+0.55});
        }
      }
      if(rng()<0.6){
        placeXrayPanel(g, f, sub, rng);
      }
      if(rng()<0.45){
        const northRooms2=(sub.r0<=2);
        const pm=new THREE.Mesh(new THREE.PlaneGeometry(0.9,1.2),posterMats[Math.floor(rng()*3)]);
        const px2=wx(sub.c0)+(rng()*(sub.c1-sub.c0)*CELL);
        const pz2=northRooms2?(wz(sub.r0)-CELL/2+WALL_OFF):(wz(sub.r1)+CELL/2-WALL_OFF);
        pm.position.set(px2,f*FLOOR_H+1.6,pz2);
        if(!northRooms2)pm.rotation.y=Math.PI;
        group.add(pm);
      }
    }
  }
  let hl=0;
  shuffleArr(allFreeCells,rng);
  for(let k=0;k<allFreeCells.length&&hl<2;k++){
    const r=allFreeCells[k][0],c=allFreeCells[k][1];
    if(occupied[key(r,c)])continue;
    const lk=makeHideLocker(rng);
    lk.group.position.set(wx(c),f*FLOOR_H,wz(r));
    const dirZ=(r<7)?1:-1;
    group.add(lk.group);
    occupied[key(r,c)]=1;
    colliders[f].push({minX:wx(c)-0.5,maxX:wx(c)+0.5,minZ:wz(r)-0.35,maxZ:wz(r)+0.35});
    hideLockers[f].push({x:wx(c),z:wz(r),dirX:0,dirZ:dirZ});
    hl++;
  }
  let nl=0;
  const notesPool=NOTES_TEXT[f];
  for(let k=0;k<allFreeCells.length&&nl<3;k++){
    const rc=allFreeCells[(k*7+3)%allFreeCells.length];
    const r=rc[0],c=rc[1];
    if(occupied[key(r,c)])continue;
    const tm=makeNoteMesh();
    tm.position.set(wx(c),f*FLOOR_H+0.1,wz(r));
    group.add(tm);
    occupied[key(r,c)]=1;
    items[f].push({
      mesh:tm,type:'note',taken:false,x:wx(c),z:wz(r),
      baseY:f*FLOOR_H+0.1,ph:rng()*6,
      text:notesPool[nl]
    });
    nl++;
  }
  for(let k=allFreeCells.length-1;k>=0;k--){
    const rc=allFreeCells[k];
    const r=rc[0],c=rc[1];
    if(occupied[key(r,c)])continue;
    const km=makeKeyMesh();
    km.position.set(wx(c),f*FLOOR_H+0.9,wz(r));
    group.add(km);
    occupied[key(r,c)]=1;
    items[f].push({mesh:km,type:'key',taken:false,x:wx(c),z:wz(r),baseY:f*FLOOR_H+0.9,ph:rng()*6});
    break;
  }
  const lockable=[];
  for(let i=0;i<fd.rooms.length;i++){
    if(f===3&&i===7)continue;
    lockable.push(fd.rooms[i].def);
  }
  shuffleArr(lockable,rng);
  const nLock=1+(rng()<0.5?1:0);
  for(let i=0;i<nLock&&i<lockable.length;i++){
    lockedDoors[f].push(makeLockedPanel(f,lockable[i].dr,lockable[i].dc));
  }
  const corrCells=[];
  for(let c=5;c<=15;c++){
    if(c===10)continue;
    if(g[7][c]==='.')corrCells.push([7,c]);
  }
  for(let r=1;r<=13;r++){if(r===7)continue;if(g[r][10]==='.')corrCells.push([r,10]);}
  shuffleArr(corrCells,rng);
  let cc=0;
  for(let k=0;k<corrCells.length&&cc<5;k++){
    if(rng()<0.5)continue;
    const r=corrCells[k][0],c=corrCells[k][1];
    let item;

  const s=targetH/h;
  mdl.scale.setScalar(s);
  const b2=new THREE.Box3().setFromObject(mdl);
  mdl.position.y=-b2.min.y;
  mdl.traverse(function(o){
    if(o.isMesh){
      o.castShadow=true;
      o.frustumCulled=false;
      if(o.material){o.material.side=THREE.DoubleSide;}

  });
}

function maniacCollide(f, px, pz){
  const R=0.35;

  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){

function updateManiac(dt){
  for(let i=0;i<4;i++){
    enemyRoots[i].visible = (man.mode!=='idle' && i===man.floor);
  }
  if(man.mode==='idle')return;
  const activeRoot=enemyRoots[man.floor];
  let tx=man.tx,tz=man.tz,sp=0.7,moving=false;
  if(man.mode==='cutscene'){tx=player.x;tz=player.z;sp=0.55;}
  else if(man.mode==='hunt'){
    if(player.hiding){
      if(man.lingerT>0){
        man.lingerT-=dt;
        tx=hideRef.x;tz=hideRef.z;sp=0.5;
      } else {
        if(man.wanderT<=0){
          const p=randomPointOnFloor(man.floor);
          man.tx=p.x;man.tz=p.z;
          man.wanderT=6+Math.random()*5;
        }
        man.wanderT-=dt;
        tx=man.tx;tz=man.tz;sp=0.55;
        const wdx=man.x-tx,wdz=man.z-tz;
        if(Math.sqrt(wdx*wdx+wdz*wdz)<0.7){
          const p=randomPointOnFloor(man.floor);
          man.tx=p.x;man.tz=p.z;
          man.wanderT=6+Math.random()*5;
        }
      }
    } else {
      man.wanderT=0;
      tx=player.x;tz=player.z;sp=1.35;
    }
  } else {sp=0.7;}
  const dx=tx-man.x,dz=tz-man.z;
  const d=Math.sqrt(dx*dx+dz*dz);
  if(man.mode!=='hunt'&&man.mode!=='cutscene'&&d<0.8){
    const p=randomPointOnFloor(man.floor);man.tx=p.x;man.tz=p.z;
  }
  if(d>0.25){
    const stepX=dx/d*sp*dt;
    const stepZ=dz/d*sp*dt;
    let res=maniacCollide(man.floor, man.x+stepX, man.z);
    man.x=res.x;
    res=maniacCollide(man.floor, man.x, man.z+stepZ);
    man.z=res.z;
    activeRoot.rotation.y=Math.atan2(dx,dz);
    moving=true;
  }
  activeRoot.position.set(man.x, man.floor*FLOOR_H, man.z);
  const mxer=enemyMixers[man.floor];
  if(mxer)mxer.update(dt*(moving?0.85:0.15));
  const pdx=man.x-player.x,pdz=man.z-player.z;
  const pd=Math.sqrt(pdx*pdx+pdz*pdz);
  if(man.floor===player.floor&&pd<20){
    man.groanT-=dt;
    if(man.groanT<=0){playGroan(Math.max(0.1,1-pd/22));man.groanT=4+Math.random()*6;}
  }
  if(ow.phase==='hunt'&&!player.hiding&&elev.state!=='moving'&&man.floor===player.floor&&pd<1.0){
    gameOver();
  }
}

function solidCell(f,r,c){

function pushOut(px,pz,R,minX,maxX,minZ,maxZ){
  const cx=Math.max(minX,Math.min(px,maxX));
  const cz=Math.max(minZ,Math.min(pz,maxZ));
  const dx=px-cx,dz=pz-cz;
  const d2=dx*dx+dz*dz;
  if(d2<R*R){
    if(d2>1e-9){const d=Math.sqrt(d2);px=cx+dx/d*R;pz=cz+dz/d*R;}
    else{
      const l=px-minX,r2=maxX-px,t=pz-minZ,b=maxZ-pz;
      const m=Math.min(l,r2,t,b);
      if(m===l)px=minX-R;else if(m===r2)px=maxX+R;else if(m===t)pz=minZ-R;else pz=maxZ+R;
    }
  }
  return {x:px,z:pz};
}

    if(solidCell(f,r,c)){
      const res=pushOut(px,pz,R,wx(c)-CELL/2,wx(c)+CELL/2,wz(r)-CELL/2,wz(r)+CELL/2);
      px=res.x;pz=res.z;

  }
  const fc=colliders[f];
  for(let i=0;i<fc.length;i++){
    const a=fc[i];
    const res=pushOut(px,pz,R,a.minX,a.maxX,a.minZ,a.maxZ);
    px=res.x;pz=res.z;
  }
  const amt=(f===elev.carFloor)?elev.doorAmt:0;
  if(amt<0.9){
    const res=pushOut(px,pz,R,doorX-0.2,doorX+0.2,shaftZ-0.78,shaftZ+0.78);
    px=res.x;pz=res.z;
  }
  return {x:px,z:pz};
}

const input={joyId:null,lookId:null,joyOX:0,joyOY:0,joyX:0,joyY:0,lookLX:0,lookLY:0,keys:{}};
const joyBase=document.getElementById('joyBase');
const joyStick=document.getElementById('joyStick');
function applyLook(dx,dy,sens){
  if(!started||inputLock)return;
  player.yaw-=dx*sens;
  player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-dy*sens));
  if(player.hiding){
    const df=angDiff(player.yaw,hideYaw);
    if(df>0.55)player.yaw=hideYaw+0.55;
    if(df<-0.55)player.yaw=hideYaw-0.55;
    player.pitch=Math.max(-0.3,Math.min(0.3,player.pitch));
  }
}
function canvasTouchStart(e){
  e.preventDefault();
  if(!started||over)return;
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(t.clientX<window.innerWidth*0.5&&input.joyId===null){
      input.joyId=t.identifier;input.joyOX=t.clientX;input.joyOY=t.clientY;
      joyBase.style.display='block';joyBase.style.left=(t.clientX-60)+'px';joyBase.style.top=(t.clientY-60)+'px';
      joyStick.style.transform='translate(0px,0px)';
    }else if(input.lookId===null){
      input.lookId=t.identifier;input.lookLX=t.clientX;input.lookLY=t.clientY;
    }
  }
}
function canvasTouchMove(e){
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(t.identifier===input.joyId){
      let dx=t.clientX-input.joyOX,dy=t.clientY-input.joyOY;
      const len=Math.sqrt(dx*dx+dy*dy),max=55;
      if(len>max){dx=dx/len*max;dy=dy/len*max;}
      joyStick.style.transform='translate('+dx+'px,'+dy+'px)';
      input.joyX=dx/max;input.joyY=dy/max;
    }else if(t.identifier===input.lookId){
      const dx=t.clientX-input.lookLX,dy=t.clientY-input.lookLY;
      input.lookLX=t.clientX;input.lookLY=t.clientY;
      applyLook(dx,dy,0.0045);
    }
  }
}
function canvasTouchEnd(e){
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(t.identifier===input.joyId){input.joyId=null;input.joyX=0;input.joyY=0;joyBase.style.display='none';}
    if(t.identifier===input.lookId){input.lookId=null;}
  }
}

// ================= ELEVATOR LOGIC =================
function startMove(){
  elev.fromF=elev.carFloor;
  elev.rideDur=1.1+Math.abs(elev.targetFloor-elev.carFloor)*1.9;
  elev.rideT=0;
  elev.riding=(Math.abs(player.x-shaftX)<1.15&&Math.abs(player.z-shaftZ)<1.15&&player.floor===elev.carFloor);
  elev.state='moving';
  shakeAmp=Math.max(shakeAmp,0.06);
  startMotor();
}
function pressFloorBtn(f){
  if(!started||over)return;
  if(elev.state==='moving'||elev.state==='closing'||elev.state==='opening')return;
  if(!playerInCar())return;
  if(f===elev.carFloor){
    if(elev.doorAmt<1)elev.state='opening';
  }else{
    elev.targetFloor=f;
    if(elev.doorAmt>0)elev.state='closing';
    else startMove();
  }
}
function callElevator(){
  if(!started||over)return;
  const f=player.floor;
  if(elev.state==='moving'||elev.state==='closing'||elev.state==='opening')return;
  if(Math.abs(player.x-doorX)<2.8&&Math.abs(player.z-shaftZ)<2.4){
    if(elev.carFloor===f){elev.state='opening';}
    else{elev.targetFloor=f;if(elev.doorAmt>0)elev.state='closing';else startMove();}
  }
}
function updateElevator(dt){
  const E=elev;
  switch(E.state){
    case 'opening':
      if(!E.sndDoor){playDoorSlide();E.sndDoor=true;}
      E.doorAmt=Math.min(1,E.doorAmt+dt/1.7);
      if(E.doorAmt>=1){E.state='open_idle';E.dwell=9;E.sndDoor=false;}
      break;
    case 'closing':
      if(!E.sndDoor){playDoorSlide();E.sndDoor=true;}
      E.doorAmt=Math.max(0,E.doorAmt-dt/1.4);
      if(E.doorAmt<=0){
        E.sndDoor=false;
        if(E.targetFloor!==E.carFloor)startMove();
        else E.state='closed_idle';
      }
      break;
    case 'open_idle':
      if(!playerInCar()){E.dwell-=dt;if(E.dwell<=0){E.state='closing';}}
      else E.dwell=9;
      break;
    case 'moving':{
      E.rideT+=dt;
      const t=Math.min(1,E.rideT/E.rideDur);
      const s=t*t*(3-2*t);
      curCarY=(E.fromF+(E.targetFloor-E.fromF)*s)*FLOOR_H;
      const vel=Math.abs(E.targetFloor-E.fromF)*6*t*(1-t)/E.rideDur;
      shakeAmp=Math.max(shakeAmp,0.005+0.016*vel);
      if(Math.random()<0.012)shakeAmp=Math.max(shakeAmp,0.05);
      if(t>=1){
        curCarY=E.targetFloor*FLOOR_H;
        E.carFloor=E.targetFloor;
        E.state='opening';
        stopMotor();
        playDing();
        shakeAmp=Math.max(shakeAmp,0.09);
        if(E.riding){
          player.floor=E.carFloor;
          E.riding=false;
          showFloorTitle(E.carFloor);
          showMissionHint(E.carFloor);
          if(ow.active&&ow.phase==='hunt'){
            man.floor=player.floor;
            const p=randomPointOnFloor(man.floor);
            man.x=p.x;man.z=p.z;man.tx=p.x;man.tz=p.z;
          }
        }
      }
      break;
    }
  }
  carGroup.position.y=curCarY;
  const slide=E.doorAmt*0.5;
  carDoorL.position.z=-(0.35+slide);
  carDoorR.position.z=(0.35+slide);
  for(let f=0;f<FLOORS;f++){
    if(!outerDoors[f]) continue;
    const amt=(f===E.carFloor)?E.doorAmt:0;
    const s2=amt*0.5;
    outerDoors[f].L.position.z=-(0.36+s2);
    outerDoors[f].R.position.z=(0.36+s2);
  }
  carGroup.visible=(E.carFloor===player.floor)||E.state==='moving';
  let ci=0.9;
  if(E.state==='moving'){
    ci=(Math.random()<0.18)?0.15:(0.5+Math.random()*0.6);
  }else if(Math.random()<0.01){ci=0.2;}
  carLight.intensity=ci*(lightsOutT>0||ow.active?0.08:1);
  if(carGroup.userData.lightPanel)carGroup.userData.lightPanel.material.emissiveIntensity=0.4+ci;
}

// ================= LIGHTS =================
let assignedLights=[];
let lightRefreshT=0,lastLightFloor=-1;
function refreshLights(){
  const f=player.floor;
  const list=fixtures[f]||[];
  const arr=[];
  for(let i=0;i<list.length;i++){
    const fx=list[i];
    if(fx.type===0)continue;
    const dx=fx.x-player.x,dz=fx.z-player.z;
    arr.push({d:dx*dx+dz*dz,fx:fx});
  }
  arr.sort(function(a,b){return a.d-b.d;});
  assignedLights=arr.slice(0,4).map(function(o){return o.fx;});
  lightRefreshT=0.3;lastLightFloor=f;
}
function updateLights(dt,tNow){
  lightRefreshT-=dt;
  if(lightRefreshT<=0||lastLightFloor!==player.floor)refreshLights();
  const fixtureMul=(lightsOutT>0||ow.active)?0:1;
  const flashMul=(lightsOutT>0)?0:1;
  for(let i=0;i<poolLights.length;i++){
    const L=poolLights[i];
    if(i<assignedLights.length){
      const fx=assignedLights[i];
      let inten=fx.base;
      if(fx.type===2){
        inten*=(Math.sin(tNow*31+fx.phase)>-0.25)?(0.75+Math.random()*0.45):0;
        if(Math.random()<0.05)inten=0;
        fx.mat.emissiveIntensity=Math.max(0.02,inten*1.3*fixtureMul);
      }
      L.visible=true;
      L.position.set(fx.x,fx.y,fx.z);
      L.intensity=inten*fixtureMul*(1+0.04*Math.sin(tNow*17+fx.phase));
    }else{
      L.visible=false;L.intensity=0;
    }
  }
  matPanelOn.emissiveIntensity=fixtureMul?1.4:0.0;
  if(ow.active){ambient.color.setHex(0x3a1208);ambient.intensity=0.32;}
  else{ambient.color.setHex(0x0b100e);ambient.intensity=lightsOutT>0?0.06:0.5;}
  let fi=flashOn?2.4:0;
  if(fi>0){
    if(Math.random()<0.03)fi*=0.25;
    fi*=(0.94+0.06*Math.sin(tNow*8.3));
  }
  flash.intensity=fi*flashMul;
}

// ================= PLAYER UPDATE =================
function updatePlayer(dt,tNow){
  const E=elev;
  if(player.hiding){
    const l=hideRef;
    camera.position.set(l.x+l.dirX*0.12+shakeX,player.floor*FLOOR_H+EYE-0.1+shakeY,l.z+l.dirZ*0.12+shakeZ);
    camera.rotation.set(player.pitch,player.yaw,0);
    shakeAmp*=Math.pow(0.02,dt);
    shakeX=(Math.random()-0.5)*shakeAmp*2;shakeY=(Math.random()-0.5)*shakeAmp*2;shakeZ=(Math.random()-0.5)*shakeAmp*2;
    return;
  }
  let ix=input.joyX,iy=input.joyY;
  const k=input.keys;
  if(!inputLock){
    if(k['KeyW']||k['ArrowUp'])iy-=1;
    if(k['KeyS']||k['ArrowDown'])iy+=1;
    if(k['KeyA']||k['ArrowLeft'])ix-=1;
    if(k['KeyD']||k['ArrowRight'])ix+=1;
  }else{ix=0;iy=0;}
  let raw=Math.sqrt(ix*ix+iy*iy);
  if(raw>1){ix/=raw;iy/=raw;raw=1;}
  const mag=Math.min(1,raw);
  const inCar=playerInCar();
  if(E.state==='moving'&&E.riding){
    player.x=Math.max(shaftX-0.9,Math.min(shaftX+0.9,player.x));
    player.z=Math.max(shaftZ-0.9,Math.min(shaftZ+0.9,player.z));
  }else if(mag>0.05&&!inputLock){
    const fx=-Math.sin(player.yaw),fz=-Math.cos(player.yaw);
    const rx=Math.cos(player.yaw),rz=-Math.sin(player.yaw);
    const vx=(fx*(-iy)+rx*ix)*2.45;
    const vz=(fz*(-iy)+rz*ix)*2.45;
    let res=collideWorld(player.floor,player.x+vx*dt,player.z);
    player.x=res.x;
    res=collideWorld(player.floor,player.x,player.z+vz*dt);
    player.z=res.z;
    const moved=Math.sqrt(vx*vx+vz*vz)*dt;
    bobPhase+=dt*8.2*mag;
    stepAcc+=moved;
    if(stepAcc>0.85){stepAcc=0;}
  }
  if(inCar&&E.state!=='moving'){
    player.x=Math.max(shaftX-1.35,Math.min(shaftX+1.0,player.x));
    player.z=Math.max(shaftZ-1.0,Math.min(shaftZ+1.0,player.z));
  }
  bobAmp+=((mag>0.05?0.05:0)-bobAmp)*Math.min(1,dt*6);
  const bobY=Math.sin(bobPhase)*bobAmp;
  const baseY=(E.state==='moving'&&E.riding)?curCarY:player.floor*FLOOR_H;
  shakeAmp*=Math.pow(0.02,dt);
  if(shakeAmp<0.0005)shakeAmp=0;
  shakeX=(Math.random()-0.5)*shakeAmp*2;
  shakeY=(Math.random()-0.5)*shakeAmp*2;
  shakeZ=(Math.random()-0.5)*shakeAmp*2;
  rollShake=(Math.random()-0.5)*shakeAmp*1.5;
  camera.position.set(player.x+shakeX,baseY+EYE+bobY+shakeY,player.z+shakeZ);
  camera.rotation.set(player.pitch,player.yaw,Math.sin(bobPhase*0.5)*bobAmp*0.22+rollShake);
}
function updateDust(dt,tNow){
  dustPoints.position.set(player.x,player.floor*FLOOR_H+1.6,player.z);
  const pos=dustGeo.attributes.position.array;
  for(let i=0;i<DUST_N;i++){
    const v=dustVel[i];
    pos[i*3]+=v.x*dt+Math.sin(tNow*0.7+v.p)*0.002;
    pos[i*3+1]+=v.y*dt*0.35+Math.cos(tNow*0.5+v.p)*0.0015;
    pos[i*3+2]+=v.z*dt;
    if(pos[i*3]>9)pos[i*3]-=18;if(pos[i*3]<-9)pos[i*3]+=18;
    if(pos[i*3+1]>1.6)pos[i*3+1]-=3.2;if(pos[i*3+1]<-1.6)pos[i*3+1]+=3.2;
    if(pos[i*3+2]>9)pos[i*3+2]-=18;if(pos[i*3+2]<-9)pos[i*3+2]+=18;
  }
  dustGeo.attributes.position.needsUpdate=true;
  if(ow.active){
    dustMat.color.setHex(0xcc4418);
    dustMat.size=0.06;
    dustMat.opacity=0.75;
  }else{
    dustMat.color.setHex(0x9a9680);
    dustMat.size=0.045;
    dustMat.opacity=0.55;
  }
}

    wallsMeshes[f].material=on?matWallOW:matWall;

    ceilMeshes[f].material=on?matCeilOW:matCeil;

  scene.fog.color.setHex(on?0x3a1208:0x04060a);

function lbShow(on){document.body.classList.toggle('lbOn',on);}
function startOW(){
  ow.active=true;ow.phase='cutscene';ow.csT=0;ow.turned=false;
  inputLock=true;lbShow(true);
  try{sndSiren.currentTime=0;sndSiren.volume=0.85;sndSiren.play();}catch(e){}
  man.floor=player.floor;
  man.x=doorX-1.4;
  man.z=shaftZ;
  man.tx=player.x;man.tz=player.z;
  man.mode='cutscene';
  playWhisper();
}
function updateOW(dt){
  if(over)return;
  if(!ow.active){
    ow.timer-=dt;
    if(ow.timer<=0)startOW();
    return;
  }
  if(ow.phase==='cutscene'){
    ow.csT+=dt;
    const dx=man.x-player.x,dz=man.z-player.z;
    const targetYaw=Math.atan2(-dx,-dz);
    player.yaw+=angDiff(targetYaw,player.yaw)*Math.min(1,dt*1.8);
    if(!ow.turned&&ow.csT>=4.5){
      ow.turned=true;
      try{sndSiren.pause();}catch(e){}
      applyOW(true);
      man.mode='hunt';
      playGroan(1);
      flashScreen();
      shakeAmp=Math.max(shakeAmp,0.05);
      try{sndAmb.volume=0.15;}catch(e){}
    }
    if(ow.csT>=8.5){
      ow.phase='hunt';ow.huntT=120;
      inputLock=false;lbShow(false);
    }
  }else if(ow.phase==='hunt'){
    ow.huntT-=dt;
    if(ow.huntT<=0)endOW();
  }
}
function endOW(){
  ow.active=false;ow.phase='calm';ow.timer=120;
  applyOW(false);
  man.mode='idle';
  for(let i=0;i<4;i++)enemyRoots[i].visible=false;

  try{sndAmb.volume=0.4;}catch(e){}
  playCreak();
}

function updateWinCutscene(dt){
  winT+=dt;

  // Фаза 1 (0-2.4 сек): глаза закрыты, мы "проваливаемся" — страшная больница уходит
  if(winT<2.4) return;

    winPhase=1;
    document.getElementById('lids').classList.remove('closed');

  }

  const openK=Math.min(1,(winT-2.4)/2.5);
  winCam.position.y=1.05+(1-openK)*0.1;
  winCam.position.x=Math.sin(winT*0.4)*0.02;

  if(winT>=5.0 && winT<11.0){

  } else if(winT>=11.0){

}

function ghostElevator(){

function nearestAction(){
  if(player.hiding)return {label:'ВЫЙТИ ИЗ ШКАФА',fn:exitLocker};
  const f=player.floor;
  const its=items[f]||[];
  for(let i=0;i<its.length;i++){
    const it=its[i];
    if(it.taken)continue;
    const d=Math.hypot(it.x-player.x,it.z-player.z);
    if(d<1.35){
      if(it.type==='note')return {label:'ВОСПОМИНАНИЕ',fn:function(){takeItem(it);}};
      return {label:'ПОДОБРАТЬ КЛЮЧ',fn:function(){takeItem(it);}};
    }
  }
  const lds=lockedDoors[f]||[];
  for(let i=0;i<lds.length;i++){
    const ld=lds[i];
    if(ld.unlocked)continue;
    const d=Math.hypot(wx(ld.c)-player.x,wz(ld.r)-player.z);
    if(d<1.8){
      return {label:hasKey[f]?'ОТКРЫТЬ ДВЕРЬ 🔑':'ЗАПЕРТО — НУЖЕН КЛЮЧ',fn:function(){unlockDoor(ld);}};
    }
  }
  if(Math.abs(player.x-doorX)<2.8&&Math.abs(player.z-shaftZ)<2.4){
    const inCar2=playerInCar();
    if(!inCar2&&elev.state==='closed_idle'){
      return {label:(elev.carFloor===f)?'ОТКРЫТЬ ДВЕРИ':'ВЫЗВАТЬ ЛИФТ',fn:callElevator};
    }
  }
  if(f===0&&Math.hypot(exitDoorPos.x-player.x,exitDoorPos.z-player.z)<1.9){
    const allDone=totalNotes()>=TOTAL_NOTES;
    return {label:allDone?'ВЫЙТИ ИЗ БОЛЬНИЦЫ':'ВЫХОД ЗАПЕРТ 📝 '+totalNotes()+'/'+TOTAL_NOTES,fn:function(){
      if(allDone){playCreak();setTimeout(winGame,900);}
      else showHint('Дверь заперта. Соберите все воспоминания ('+totalNotes()+'/'+TOTAL_NOTES+').',3500);
    }};
  }
  const hls=hideLockers[f]||[];
  for(let i=0;i<hls.length;i++){
    const l=hls[i];
    const d=Math.hypot(l.x-player.x,l.z-player.z);
    if(d<1.5)return {label:'СПРЯТАТЬСЯ В ШКАФУ',fn:function(){enterLocker(l);}};
  }
  return null;
}
function takeItem(it){
  it.taken=true;it.mesh.visible=false;
  const f=player.floor;
  if(it.type==='note'){
    notesCollected[f]++;
    playDing();
    if(it.text)setSub(it.text,15000);
    if(notesCollected[f]>=3){
      if(f===0)showHint('Все воспоминания на этаже собраны!',4500);
      else showHint('Воспоминания собраны на этом этаже.',4500);
    }else{
      showHint('Воспоминание найдено ('+notesCollected[f]+'/3).',2500);
    }
  }else{
    hasKey[f]=true;
    playDing();
    showHint('Ключ найден! Он откроет все запертые двери этого этажа.',5000);
  }
}
function unlockDoor(ld){
  if(!hasKey[player.floor]){
    showHint('Заперто. Где-то на этаже должен быть ключ…',3500);
    playBang(0.2,0);

  ld.panel.visible=false;
  colliders[player.floor]=colliders[player.floor].filter(function(a){return a!==ld.aabb;});
  playCreak();playDoorSlide();
  showHint('Дверь открыта.',2500);
}

function updateIntro(dt){

    document.getElementById('lids').classList.remove('closed');
    canvas.style.filter='blur(0px)';
  }
  let camY,pitch=player.pitch;
  if(t<4.2){
    const k2=Math.max(0,Math.min(1,(t-1.6)/2.6));
    const s=k2*k2*(3-2*k2);
    camY=0.4+(EYE-0.4)*s;
    pitch=-0.55*(1-s);
  }else{
    camY=EYE;
    pitch=0;
  }
  if(t>=4.2&&t<7.2){
    player.yaw=intro.baseYaw+Math.sin((t-4.2)*1.1)*0.9;
    pitch=Math.sin((t-4.2)*0.9)*0.12;
  }
  if(t>=7.2&&t<10.4)setSub('— Чёрт… где я?');
  else if(t>=10.8&&t<14.0)setSub('— Нужно найти выход отсюда.');
  else if(t>=14.0)setSub('');
  shakeAmp*=Math.pow(0.02,dt);
  shakeX=(Math.random()-0.5)*shakeAmp;shakeY=(Math.random()-0.5)*shakeAmp;shakeZ=(Math.random()-0.5)*shakeAmp;
  camera.position.set(player.x+shakeX,player.floor*FLOOR_H+camY+shakeY,player.z+shakeZ);
  camera.rotation.set(pitch,player.yaw,Math.sin(t*1.7)*0.01);
  if(t>=14.6&&intro.active){
    intro.active=false;
    started=true;
    player.pitch=0;
    showFloorTitle(3);
    showMissionHint(3);
    scheduleAmbient();
    ow.timer=120;
  }
}

let menuT=0;
function updateMenu(dt){
  menuT+=dt;
  if(menuGirlMixer)menuGirlMixer.update(dt);
  const angle=menuT*0.18;
  const radius=2.7;
  const camX=Math.cos(angle)*radius;
  const camZ=Math.sin(angle)*radius;
  menuCam.position.set(camX, 1.55, camZ);
  menuCam.lookAt(0,1.0,0);

  const on = (Math.floor(menuT / 3) % 2) === 0;
  const targetLight = on ? 0.55 : 0.0;
  const targetAmbient = on ? 0.25 : 0.03;
  menuLight.intensity += (targetLight - menuLight.intensity) * Math.min(1, dt*4);
  menuAmbient.intensity += (targetAmbient - menuAmbient.intensity) * Math.min(1, dt*4);

  const mp=menuDustGeo.attributes.position.array;
  for(let i=0;i<MENU_DUST_N;i++){
    const v=menuDustVel[i];
    mp[i*3]+=v.x*dt+Math.sin(menuT*0.6+v.p)*0.0025;
    mp[i*3+1]+=v.y*dt*0.5+Math.cos(menuT*0.4+v.p)*0.0018;
    mp[i*3+2]+=v.z*dt;
    if(mp[i*3]>2.8)mp[i*3]-=5.6; if(mp[i*3]<-2.8)mp[i*3]+=5.6;
    if(mp[i*3+1]>1.4)mp[i*3+1]-=2.8; if(mp[i*3+1]<-1.4)mp[i*3+1]+=2.8;
    if(mp[i*3+2]>2.8)mp[i*3+2]-=5.6; if(mp[i*3+2]<-2.8)mp[i*3+2]+=5.6;
  }
  menuDustGeo.attributes.position.needsUpdate=true;
}
